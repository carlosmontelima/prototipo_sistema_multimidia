<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-labelledby="svg-speaker-title svg-speaker-desc">
  <title id="svg-speaker-title">Transdutor Eletroacustico — Alto-Falante Dinamico</title>
  <desc id="svg-speaker-desc">Diagrama tecnico vetorial de um alto-falante mostrando ima permanente N/S, bobina movel, tensao de audio, eixo de movimento, cone e ondas sonoras de pressao atmosferica.</desc>

  <defs>
    <pattern id="techGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1B2432" stroke-width="0.75"/>
    </pattern>
    <linearGradient id="magnetNorth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3B5C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF3B5C" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="magnetSouth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B8D9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00B8D9" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="coneFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00B8D9"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Camada 1: Fundo e Grade Tecnica -->
  <g id="layer-background-grid">
    <rect x="0" y="0" width="820" height="340" rx="12" fill="#0B0F14"/>
    <rect x="0" y="0" width="820" height="340" rx="12" fill="url(#techGrid)"/>
    <rect x="0.5" y="0.5" width="819" height="339" rx="12" fill="none" stroke="#253142" stroke-width="1"/>
    <text x="20" y="26" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.4">SCHEMATIC // TRANSDUTOR ELETRICO -&gt; ACUSTICO (ALTO-FALANTE)</text>
    <line x1="20" y1="36" x2="800" y2="36" stroke="#1E293B" stroke-width="1"/>
  </g>

  <!-- Camada 2: Entrada de Tensao de Audio -->
  <g id="layer-tensao-audio">
    <!-- Condutor superior -->
    <polyline points="116,228 386,228 386,184" fill="none" stroke="#00E599" stroke-width="2" stroke-linejoin="round"/>
    <!-- Condutor inferior -->
    <polyline points="116,276 472,276 472,184" fill="none" stroke="#00E599" stroke-width="2" stroke-linejoin="round"/>
    <!-- Terminais de entrada -->
    <circle cx="108" cy="228" r="6" fill="#0B0F14" stroke="#00E599" stroke-width="2"/>
    <circle cx="108" cy="276" r="6" fill="#0B0F14" stroke="#00E599" stroke-width="2"/>
    <text x="86" y="232" fill="#00E599" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">+</text>
    <text x="86" y="280" fill="#00E599" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">-</text>
    <!-- Mini onda senoidal de entrada AC -->
    <path d="M 52 252 Q 60 236, 68 252 T 84 252" fill="none" stroke="#00E599" stroke-width="1.8"/>
    <rect x="44" y="236" width="48" height="32" rx="4" fill="none" stroke="#1E3A34" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="132" y="257" fill="#E2E8F0" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" letter-spacing="0.8">TENSAO DE AUDIO V(t)</text>
    <text x="132" y="271" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">SINAL ELETRICO ANALOGICO</text>
  </g>

  <!-- Camada 3: Ima Permanente (Polos N e S) -->
  <g id="layer-ima-permanente">
    <!-- Corpo Polo Norte -->
    <rect x="210" y="128" width="122" height="44" rx="3" fill="url(#magnetNorth)" stroke="#FF3B5C" stroke-width="1.8"/>
    <!-- Corpo Polo Sul (parcialmente inserido na bobina) -->
    <rect x="332" y="128" width="84" height="44" rx="2" fill="url(#magnetSouth)" stroke="#00B8D9" stroke-width="1.8" stroke-dasharray="5 3"/>
    <!-- Divisoria central -->
    <line x1="332" y1="128" x2="332" y2="172" stroke="#475569" stroke-width="1.5"/>
    <!-- Rotulos N e S -->
    <text x="234" y="156" fill="#FF3B5C" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">N</text>
    <text x="386" y="156" fill="#00B8D9" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">S</text>
    <!-- Linhas de campo magnetico sutis -->
    <path d="M 240 124 C 240 96, 395 96, 395 124" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 240 176 C 240 204, 395 204, 395 176" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Camada 4: Bobina Movel (Voice Coil) -->
  <g id="layer-bobina-movel">
    <!-- Cilindro suporte da bobina -->
    <rect x="372" y="116" width="114" height="68" rx="4" fill="rgba(245, 158, 11, 0.08)" stroke="#F59E0B" stroke-width="1.8"/>
    <!-- Espiras do enrolamento -->
    <path d="M 386 116 C 386 105, 404 105, 404 116 L 404 184 C 404 195, 422 195, 422 184 L 422 116 C 422 105, 440 105, 440 116 L 440 184 C 440 195, 458 195, 458 184 L 458 116 C 458 105, 472 105, 472 116 L 472 184" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Linhas verticais internas das espiras -->
    <line x1="386" y1="116" x2="386" y2="184" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Camada 5: Cone do Alto-Falante e Acoplamento Mecanico -->
  <g id="layer-cone-alto-falante">
    <!-- Haste de acoplamento bobina-cone -->
    <line x1="486" y1="150" x2="544" y2="150" stroke="#CBD5E1" stroke-width="3"/>
    <!-- Cone acustico -->
    <polygon points="544,150 618,86 618,214" fill="url(#coneFill)" stroke="#E2E8F0" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Calota protetora (dust cap) -->
    <path d="M 564 133 Q 576 150, 564 167" fill="none" stroke="#00B8D9" stroke-width="1.8"/>
    <!-- Borda de suspensao -->
    <path d="M 618 86 Q 626 80, 626 92" fill="none" stroke="#64748B" stroke-width="2"/>
    <path d="M 618 214 Q 626 220, 626 208" fill="none" stroke="#64748B" stroke-width="2"/>
  </g>

  <!-- Camada 6: Indicador de Movimento Bidirecional -->
  <g id="layer-indicador-movimento">
    <line x1="546" y1="68" x2="626" y2="68" stroke="#F59E0B" stroke-width="2" marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)"/>
    <text x="586" y="56" text-anchor="middle" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.2">MOVIMENTO</text>
  </g>

  <!-- Camada 7: Ondas Sonoras (Pressao Atmosferica) -->
  <g id="layer-ondas-sonoras">
    <path id="wave-1" d="M 644 102 C 658 118, 658 182, 644 198" fill="none" stroke="#00E599" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>
    <path id="wave-2" d="M 668 90 C 688 114, 688 186, 668 210" fill="none" stroke="#00E599" stroke-width="2.1" stroke-linecap="round" opacity="0.78"/>
    <path id="wave-3" d="M 696 78 C 722 110, 722 190, 696 222" fill="none" stroke="#00B8D9" stroke-width="1.8" stroke-linecap="round" opacity="0.58"/>
    <path id="wave-4" d="M 728 68 C 758 108, 758 192, 728 232" fill="none" stroke="#00B8D9" stroke-width="1.4" stroke-linecap="round" opacity="0.36"/>
  </g>

  <!-- Camada 8: Anotacoes e Legendas Tecnicas -->
  <g id="layer-anotacoes-tecnicas">
    <!-- Ima Permanente -->
    <text x="36" y="144" fill="#F1F5F9" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">IMA PERMANENTE</text>
    <text x="36" y="160" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">CAMPO MAGNETICO FIXO</text>
    <line x1="168" y1="150" x2="204" y2="150" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrowMuted)"/>

    <!-- Bobina -->
    <text x="320" y="72" text-anchor="middle" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">BOBINA MOVEL</text>
    <text x="320" y="86" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">FORCA DE LORENTZ</text>
    <line x1="364" y1="80" x2="392" y2="108" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrowMuted)"/>

    <!-- Cone do Alto-Falante -->
    <text x="530" y="294" fill="#F1F5F9" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">CONE DO ALTO-FALANTE</text>
    <text x="530" y="309" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">DIAFRAGMA ACUSTICO</text>
    <line x1="572" y1="274" x2="594" y2="210" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrowMuted)"/>

    <!-- Ondas Sonoras -->
    <text x="720" y="264" text-anchor="middle" fill="#00E599" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">ONDAS SONORAS</text>
    <text x="720" y="279" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">PRESSAO ATMOSFERICA</text>
    <text x="720" y="294" text-anchor="middle" fill="#00B8D9" font-family="'JetBrains Mono', monospace" font-size="10">P ~ A^2</text>
  </g>
</svg>
