<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-labelledby="svg-speaker-title svg-speaker-desc">
  <title id="svg-speaker-title">Transdutor Eletroacústico — Alto-Falante Dinâmico</title>
  <desc id="svg-speaker-desc">Diagrama técnico vetorial de um alto-falante com ímã permanente N/S, bobina móvel, tensão de áudio, eixo de movimento, cone e ondas sonoras de pressão atmosférica.</desc>

  <defs>
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18181C" stroke-width="0.75"/>
    </pattern>
    <linearGradient id="magnetNorth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="magnetSouth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.24"/>
    </linearGradient>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF5500"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#71717A"/>
    </marker>
  </defs>

  <!-- Camada 1: Fundo e Grade Técnica -->
  <g id="layer-background-grid">
    <rect x="0" y="0" width="820" height="320" rx="8" fill="#09090B"/>
    <rect x="0" y="0" width="820" height="320" rx="8" fill="url(#techGrid)"/>
    <rect x="0.5" y="0.5" width="819" height="319" rx="8" fill="none" stroke="#222226" stroke-width="1"/>
  </g>

  <!-- Camada 2: Entrada de Tensão de Áudio -->
  <g id="layer-tensao-audio">
    <polyline points="116,216 386,216 386,174" fill="none" stroke="#FF5500" stroke-width="1.8" stroke-linejoin="round"/>
    <polyline points="116,262 472,262 472,174" fill="none" stroke="#FF5500" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="108" cy="216" r="5" fill="#09090B" stroke="#FF5500" stroke-width="1.8"/>
    <circle cx="108" cy="262" r="5" fill="#09090B" stroke="#FF5500" stroke-width="1.8"/>
    <text x="86" y="220" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">+</text>
    <text x="86" y="266" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">-</text>
    <path d="M 52 239 Q 60 223, 68 239 T 84 239" fill="none" stroke="#FF5500" stroke-width="1.6"/>
    <text x="132" y="244" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">Tensão de Áudio V(t)</text>
  </g>

  <!-- Camada 3: Ímã Permanente (Polos N e S) -->
  <g id="layer-ima-permanente">
    <rect x="210" y="118" width="122" height="44" rx="2" fill="url(#magnetNorth)" stroke="#FF5500" stroke-width="1.6"/>
    <rect x="332" y="118" width="84" height="44" rx="2" fill="url(#magnetSouth)" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="5 3"/>
    <line x1="332" y1="118" x2="332" y2="162" stroke="#52525B" stroke-width="1.4"/>
    <text x="234" y="146" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="600">N</text>
    <text x="386" y="146" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="600">S</text>
  </g>

  <!-- Camada 4: Bobina Móvel -->
  <g id="layer-bobina-movel">
    <rect x="372" y="106" width="114" height="68" rx="3" fill="rgba(244, 244, 245, 0.03)" stroke="#A1A1AA" stroke-width="1.5"/>
    <path d="M 386 106 C 386 96, 404 96, 404 106 L 404 174 C 404 184, 422 184, 422 174 L 422 106 C 422 96, 440 96, 440 106 L 440 174 C 440 184, 458 184, 458 174 L 458 106 C 458 96, 472 96, 472 106 L 472 174" fill="none" stroke="#FF5500" stroke-width="2" stroke-linecap="round"/>
    <line x1="386" y1="106" x2="386" y2="174" stroke="#FF5500" stroke-width="1.8"/>
  </g>

  <!-- Camada 5: Cone do Alto-Falante -->
  <g id="layer-cone-alto-falante">
    <line x1="486" y1="140" x2="544" y2="140" stroke="#A1A1AA" stroke-width="2.6"/>
    <polygon points="544,140 618,76 618,204" fill="#18181B" stroke="#F4F4F5" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 564 123 Q 576 140, 564 157" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
  </g>

  <!-- Camada 6: Indicador de Movimento -->
  <g id="layer-indicador-movimento">
    <line x1="546" y1="58" x2="626" y2="58" stroke="#FF5500" stroke-width="1.8" marker-start="url(#arrowOrange)" marker-end="url(#arrowOrange)"/>
    <text x="586" y="46" text-anchor="middle" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Movimento</text>
  </g>

  <!-- Camada 7: Ondas Sonoras -->
  <g id="layer-ondas-sonoras">
    <path id="wave-1" d="M 644 92 C 658 108, 658 172, 644 188" fill="none" stroke="#FF5500" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
    <path id="wave-2" d="M 668 80 C 688 104, 688 176, 668 200" fill="none" stroke="#FF5500" stroke-width="1.8" stroke-linecap="round" opacity="0.72"/>
    <path id="wave-3" d="M 696 68 C 722 100, 722 180, 696 212" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" opacity="0.58"/>
    <path id="wave-4" d="M 728 58 C 758 98, 758 182, 728 222" fill="none" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round" opacity="0.36"/>
  </g>

  <!-- Camada 8: Anotações Técnicas -->
  <g id="layer-anotacoes-tecnicas">
    <text x="38" y="138" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Ímã Permanente</text>
    <line x1="146" y1="140" x2="204" y2="140" stroke="#71717A" stroke-width="1.2" marker-end="url(#arrowMuted)"/>
    <text x="320" y="62" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Bobina Móvel</text>
    <line x1="364" y1="68" x2="392" y2="96" stroke="#71717A" stroke-width="1.2" marker-end="url(#arrowMuted)"/>
    <text x="530" y="278" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Cone do Alto-Falante</text>
    <line x1="574" y1="258" x2="594" y2="200" stroke="#71717A" stroke-width="1.2" marker-end="url(#arrowMuted)"/>
    <text x="720" y="254" text-anchor="middle" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Ondas Sonoras</text>
  </g>
</svg>
