<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 250" width="1080" height="250" role="img" aria-labelledby="svg-pcm-title svg-pcm-desc">
  <title id="svg-pcm-title">Cadeia de Digitalização e Modulação PCM</title>
  <desc id="svg-pcm-desc">Fluxograma técnico vetorial da cadeia completa de digitalização de áudio: Sinal Analógico, Filtro Passa-Baixas, Amostrador PAM, Quantizador, Codificador Binário, Sistema Digital e DAC.</desc>

  <defs>
    <pattern id="pcmGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18181C" stroke-width="0.7"/>
    </pattern>
    <marker id="flowArrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF5500"/>
    </marker>
    <marker id="flowArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="flowArrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#71717A"/>
    </marker>
  </defs>

  <!-- Camada 1: Fundo e Grade -->
  <g id="layer-background">
    <rect x="0" y="0" width="1080" height="250" rx="8" fill="#09090B"/>
    <rect x="0" y="0" width="1080" height="250" rx="8" fill="url(#pcmGrid)"/>
    <rect x="0.5" y="0.5" width="1079" height="249" rx="8" fill="none" stroke="#222226" stroke-width="1"/>
  </g>

  <!-- Camada 2: Agrupamento ADC -->
  <g id="layer-grupo-adc">
    <rect x="146" y="20" width="584" height="206" rx="6" fill="#111114" stroke="#27272A" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="160" y="40" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Conversor Analógico-Digital (ADC / Modulação PCM)</text>
  </g>

  <!-- Camada 3: Entrada Sinal Analógico -->
  <g id="layer-sinal-analogico">
    <rect x="18" y="64" width="102" height="96" rx="6" fill="#111114" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="69" y="87" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Sinal Analógico</text>
    <path d="M 32 130 C 42 106, 52 106, 62 130 S 82 154, 92 130 S 100 116, 108 128" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="69" y="180" text-anchor="middle" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="9.5">x(t) contínuo</text>
  </g>

  <!-- Camada 4: Filtro Passa-Baixas -->
  <g id="layer-filtro-passa-baixas">
    <rect x="160" y="64" width="118" height="96" rx="6" fill="#18181B" stroke="#323238" stroke-width="1.2"/>
    <text x="219" y="87" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Filtro Passa-Baixas</text>
    <path d="M 182 122 L 220 122 Q 234 122, 242 146 L 256 146" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="219" y="180" text-anchor="middle" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="9">300 - 3400 Hz</text>
    <text x="219" y="195" text-anchor="middle" fill="#71717A" font-family="'Inter', sans-serif" font-size="9">Anti-aliasing</text>
  </g>

  <!-- Camada 5: Amostrador PAM -->
  <g id="layer-amostrador-pam">
    <rect x="306" y="64" width="118" height="96" rx="6" fill="#18181B" stroke="#323238" stroke-width="1.2"/>
    <text x="365" y="87" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Amostrador (PAM)</text>
    <line x1="322" y1="144" x2="408" y2="144" stroke="#323238" stroke-width="1"/>
    <line x1="334" y1="144" x2="334" y2="128" stroke="#FF5500" stroke-width="2.6"/>
    <line x1="350" y1="144" x2="350" y2="114" stroke="#FF5500" stroke-width="2.6"/>
    <line x1="366" y1="144" x2="366" y2="122" stroke="#FF5500" stroke-width="2.6"/>
    <line x1="382" y1="144" x2="382" y2="136" stroke="#FF5500" stroke-width="2.6"/>
    <line x1="398" y1="144" x2="398" y2="120" stroke="#FF5500" stroke-width="2.6"/>
    <text x="365" y="180" text-anchor="middle" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="9">Fa &gt;= 2 · Fmax</text>
    <text x="365" y="195" text-anchor="middle" fill="#71717A" font-family="'Inter', sans-serif" font-size="9">Discreto no tempo</text>
  </g>

  <!-- Camada 6: Quantizador -->
  <g id="layer-quantizador">
    <rect x="452" y="64" width="118" height="96" rx="6" fill="#18181B" stroke="#323238" stroke-width="1.2"/>
    <text x="511" y="87" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Quantizador</text>
    <polyline points="470,144 484,144 484,132 498,132 498,120 512,120 512,112 530,112 530,126 550,126" fill="none" stroke="#FF5500" stroke-width="1.8"/>
    <text x="511" y="180" text-anchor="middle" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="9">q = 2^v</text>
    <text x="511" y="195" text-anchor="middle" fill="#71717A" font-family="'Inter', sans-serif" font-size="9">Níveis discretos</text>
  </g>

  <!-- Camada 7: Codificador Binário -->
  <g id="layer-codificador-binario">
    <rect x="598" y="64" width="118" height="96" rx="6" fill="#18181B" stroke="#FF5500" stroke-width="1.4"/>
    <text x="657" y="87" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Codificador Binário</text>
    <rect x="612" y="110" width="90" height="28" rx="4" fill="#09090B" stroke="#222226"/>
    <text x="657" y="128" text-anchor="middle" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">110 100 001</text>
    <text x="657" y="180" text-anchor="middle" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="9">v bits / amostra</text>
  </g>

  <!-- Camada 8: Sistema Digital -->
  <g id="layer-sistema-digital">
    <rect x="756" y="64" width="122" height="96" rx="6" fill="#111114" stroke="#323238" stroke-width="1.4"/>
    <text x="817" y="102" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Sistema Digital</text>
    <text x="817" y="122" text-anchor="middle" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="9">DSP / WAV / FLAC</text>
    <text x="817" y="180" text-anchor="middle" fill="#71717A" font-family="'Inter', sans-serif" font-size="9">Imune a ruído de linha</text>
  </g>

  <!-- Camada 9: DAC e Saída Reconstruída -->
  <g id="layer-dac">
    <polygon points="912,64 1004,112 912,160" fill="#111114" stroke="#FF5500" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="944" y="117" text-anchor="middle" fill="#F4F4F5" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">DAC</text>
    <path d="M 1022 112 Q 1032 90, 1042 112 T 1062 112" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="954" y="180" text-anchor="middle" fill="#71717A" font-family="'Inter', sans-serif" font-size="9.5">Reconstrução</text>
  </g>

  <!-- Camada 10: Setas de Conexão de Fluxo -->
  <g id="layer-conexoes-fluxo">
    <line x1="120" y1="112" x2="154" y2="112" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#flowArrowBlue)"/>
    <line x1="278" y1="112" x2="300" y2="112" stroke="#71717A" stroke-width="1.8" marker-end="url(#flowArrowMuted)"/>
    <line x1="424" y1="112" x2="446" y2="112" stroke="#FF5500" stroke-width="1.8" marker-end="url(#flowArrowOrange)"/>
    <line x1="570" y1="112" x2="592" y2="112" stroke="#FF5500" stroke-width="1.8" marker-end="url(#flowArrowOrange)"/>
    <line x1="716" y1="112" x2="750" y2="112" stroke="#71717A" stroke-width="1.8" marker-end="url(#flowArrowMuted)"/>
    <line x1="878" y1="112" x2="906" y2="112" stroke="#71717A" stroke-width="1.8" marker-end="url(#flowArrowMuted)"/>
    <line x1="1004" y1="112" x2="1018" y2="112" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#flowArrowBlue)"/>
  </g>
</svg>
