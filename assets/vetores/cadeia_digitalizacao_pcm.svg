<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300" role="img" aria-labelledby="svg-pcm-title svg-pcm-desc">
  <title id="svg-pcm-title">Cadeia de Digitalizacao e Modulacao PCM</title>
  <desc id="svg-pcm-desc">Fluxograma tecnico vetorial da cadeia completa de digitalizacao de audio: Sinal Analogico, Filtro Passa-Baixas, Amostrador PAM, Quantizador, Codificador Binario, Sistema Digital e DAC.</desc>

  <defs>
    <pattern id="pcmGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#182230" stroke-width="0.7"/>
    </pattern>
    <marker id="flowArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00E599"/>
    </marker>
    <marker id="flowArrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="flowArrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00B8D9"/>
    </marker>
  </defs>

  <!-- Camada 1: Fundo e Grade -->
  <g id="layer-background">
    <rect x="0" y="0" width="1080" height="300" rx="12" fill="#0B0F14"/>
    <rect x="0" y="0" width="1080" height="300" rx="12" fill="url(#pcmGrid)"/>
    <rect x="0.5" y="0.5" width="1079" height="299" rx="12" fill="none" stroke="#253142" stroke-width="1"/>
    <text x="20" y="25" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.4">SIGNAL CHAIN // CONVERSAO ADC -&gt; PCM -&gt; DAC</text>
  </g>

  <!-- Camada 2: Agrupamento ADC -->
  <g id="layer-grupo-adc">
    <rect x="148" y="42" width="584" height="226" rx="10" fill="rgba(0, 184, 217, 0.04)" stroke="#1E3A4C" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="162" y="60" fill="#00B8D9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.2">CONVERSOR ANALOGICO-DIGITAL (ADC / MODULACAO PCM)</text>
  </g>

  <!-- Camada 3: Entrada Sinal Analogico -->
  <g id="layer-sinal-analogico">
    <rect x="20" y="92" width="100" height="96" rx="8" fill="#11161F" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="70" y="114" text-anchor="middle" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">SINAL</text>
    <text x="70" y="128" text-anchor="middle" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">ANALOGICO</text>
    <path d="M 34 158 C 44 132, 54 132, 64 158 S 84 184, 94 158 S 102 142, 108 156" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="70" y="206" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">x(t) CONTINUO</text>
  </g>

  <!-- Camada 4: Filtro Passa-Baixas -->
  <g id="layer-filtro-passa-baixas">
    <rect x="162" y="92" width="118" height="96" rx="8" fill="#11161F" stroke="#00B8D9" stroke-width="1.5"/>
    <text x="221" y="113" text-anchor="middle" fill="#F1F5F9" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">FILTRO</text>
    <text x="221" y="127" text-anchor="middle" fill="#00B8D9" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">PASSA-BAIXAS</text>
    <!-- Curva de resposta do filtro -->
    <path d="M 184 150 L 222 150 Q 236 150, 244 174 L 258 174" fill="none" stroke="#00B8D9" stroke-width="2"/>
    <line x1="230" y1="142" x2="230" y2="176" stroke="#FF3B5C" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="221" y="206" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">300 - 3400 Hz (VOZ)</text>
    <text x="221" y="220" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8.5">ANTI-ALIASING</text>
  </g>

  <!-- Camada 5: Amostrador PAM -->
  <g id="layer-amostrador-pam">
    <rect x="308" y="92" width="118" height="96" rx="8" fill="#11161F" stroke="#00E599" stroke-width="1.5"/>
    <text x="367" y="113" text-anchor="middle" fill="#F1F5F9" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">AMOSTRADOR</text>
    <text x="367" y="127" text-anchor="middle" fill="#00E599" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">(PAM)</text>
    <!-- Pulsos PAM -->
    <line x1="324" y1="170" x2="410" y2="170" stroke="#334155" stroke-width="1"/>
    <line x1="334" y1="170" x2="334" y2="156" stroke="#00E599" stroke-width="3"/>
    <line x1="348" y1="170" x2="348" y2="144" stroke="#00E599" stroke-width="3"/>
    <line x1="362" y1="170" x2="362" y2="140" stroke="#00E599" stroke-width="3"/>
    <line x1="376" y1="170" x2="376" y2="150" stroke="#00E599" stroke-width="3"/>
    <line x1="390" y1="170" x2="390" y2="162" stroke="#00E599" stroke-width="3"/>
    <line x1="402" y1="170" x2="402" y2="152" stroke="#00E599" stroke-width="3"/>
    <text x="367" y="206" text-anchor="middle" fill="#00E599" font-family="'JetBrains Mono', monospace" font-size="9">Fa &gt;= 2 * Fmax</text>
    <text x="367" y="220" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8.5">DISCRETO NO TEMPO</text>
  </g>

  <!-- Camada 6: Quantizador -->
  <g id="layer-quantizador">
    <rect x="454" y="92" width="118" height="96" rx="8" fill="#11161F" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="513" y="113" text-anchor="middle" fill="#F1F5F9" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">QUANTIZADOR</text>
    <text x="513" y="127" text-anchor="middle" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">q = 2^v</text>
    <!-- Degraus de quantizacao -->
    <polyline points="472,172 486,172 486,160 500,160 500,148 514,148 514,140 532,140 532,154 552,154" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="513" y="206" text-anchor="middle" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="9">NIVEIS DISCRETOS</text>
    <text x="513" y="220" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8.5">ERRO e_i (RUIDO)</text>
  </g>

  <!-- Camada 7: Codificador Binario -->
  <g id="layer-codificador-binario">
    <rect x="600" y="92" width="118" height="96" rx="8" fill="#11161F" stroke="#00E599" stroke-width="1.5"/>
    <text x="659" y="113" text-anchor="middle" fill="#F1F5F9" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">CODIFICADOR</text>
    <text x="659" y="127" text-anchor="middle" fill="#00E599" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">BINARIO</text>
    <!-- Sequencia de bits -->
    <rect x="614" y="142" width="90" height="28" rx="4" fill="#090C10" stroke="#1E293B" stroke-width="1"/>
    <text x="659" y="160" text-anchor="middle" fill="#00E599" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">110 100 001</text>
    <text x="659" y="206" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">PALAVRA DE v BITS</text>
    <text x="659" y="220" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8.5">FLUXO PCM</text>
  </g>

  <!-- Camada 8: Sistema Digital -->
  <g id="layer-sistema-digital">
    <rect x="758" y="92" width="122" height="96" rx="8" fill="#11161F" stroke="#00B8D9" stroke-width="1.8"/>
    <text x="819" y="116" text-anchor="middle" fill="#00B8D9" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">SISTEMA</text>
    <text x="819" y="132" text-anchor="middle" fill="#00B8D9" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">DIGITAL</text>
    <text x="819" y="154" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">DSP / ARMAZEN.</text>
    <text x="819" y="168" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">WAV / FLAC / MP3</text>
    <text x="819" y="206" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">IMUNE A RUIDO</text>
    <text x="819" y="220" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8.5">DE TRANSMISSAO</text>
  </g>

  <!-- Camada 9: DAC e Saida Reconstruida -->
  <g id="layer-dac">
    <polygon points="914,92 1004,140 914,188" fill="#11161F" stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="945" y="144" text-anchor="middle" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">DAC</text>
    <text x="954" y="206" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">RECONSTRUCAO</text>
    <text x="954" y="220" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8.5">DIGITAL -&gt; ANALOG.</text>
    <!-- Onda reconstruida na saida -->
    <path d="M 1024 140 Q 1034 118, 1044 140 T 1064 140" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="1044" y="166" text-anchor="middle" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="8.5">OUT</text>
  </g>

  <!-- Camada 10: Setas de Conexao de Fluxo -->
  <g id="layer-conexoes-fluxo">
    <line x1="120" y1="140" x2="156" y2="140" stroke="#F59E0B" stroke-width="2" marker-end="url(#flowArrowAmber)"/>
    <line x1="280" y1="140" x2="302" y2="140" stroke="#00B8D9" stroke-width="2" marker-end="url(#flowArrowCyan)"/>
    <line x1="426" y1="140" x2="448" y2="140" stroke="#00E599" stroke-width="2" marker-end="url(#flowArrowGreen)"/>
    <line x1="572" y1="140" x2="594" y2="140" stroke="#F59E0B" stroke-width="2" marker-end="url(#flowArrowAmber)"/>
    <line x1="718" y1="140" x2="752" y2="140" stroke="#00E599" stroke-width="2" marker-end="url(#flowArrowGreen)"/>
    <line x1="880" y1="140" x2="908" y2="140" stroke="#00B8D9" stroke-width="2" marker-end="url(#flowArrowCyan)"/>
    <line x1="1004" y1="140" x2="1020" y2="140" stroke="#F59E0B" stroke-width="2" marker-end="url(#flowArrowAmber)"/>
  </g>

  <!-- Camada 11: Barra de Referencia Tecnica -->
  <g id="layer-rodape-referencia">
    <line x1="20" y1="278" x2="1060" y2="278" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="292" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">TELEFONIA PCM: Fa = 8000 Hz | Ta = 125 us | 8 bits | 64 kbps</text>
    <text x="1060" y="292" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">CD AUDIO: Fa = 44100 Hz | 16 bits | STEREO | 1411.2 kbps</text>
  </g>
</svg>
