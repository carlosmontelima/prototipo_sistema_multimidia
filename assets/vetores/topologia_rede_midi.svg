<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 335" width="920" height="335" role="img" aria-labelledby="svg-midi-title svg-midi-desc">
  <title id="svg-midi-title">Topologia de Rede MIDI — Portas IN, OUT e THRU</title>
  <desc id="svg-midi-desc">Diagrama técnico vetorial de uma rede local MIDI em série conectando computador sequenciador, teclado controlador, módulo sintetizador e processador de efeitos através das portas IN, OUT e THRU em 16 canais.</desc>

  <defs>
    <pattern id="midiGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18181C" stroke-width="0.7"/>
    </pattern>
    <marker id="midiArrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF5500"/>
    </marker>
    <marker id="midiArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="midiArrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <!-- Camada 1: Fundo e Grade -->
  <g id="layer-bg-grid">
    <rect x="0" y="0" width="920" height="335" rx="8" fill="#09090B"/>
    <rect x="0" y="0" width="920" height="335" rx="8" fill="url(#midiGrid)"/>
    <rect x="0.5" y="0.5" width="919" height="334" rx="8" fill="none" stroke="#222226" stroke-width="1"/>
  </g>

  <!-- Camada 2: Computador / Sequenciador DAW -->
  <g id="layer-computador-sequenciador">
    <rect x="196" y="24" width="124" height="54" rx="5" fill="#111114" stroke="#323238" stroke-width="1.4"/>
    <rect x="208" y="33" width="100" height="34" rx="3" fill="#09090B" stroke="#222226"/>
    <rect x="216" y="41" width="20" height="4" fill="#FF5500"/>
    <rect x="242" y="49" width="24" height="4" fill="#38BDF8"/>
    <rect x="272" y="44" width="18" height="4" fill="#FF5500"/>
    <rect x="174" y="84" width="168" height="32" rx="4" fill="#18181B" stroke="#323238"/>
    <text x="258" y="104" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Sequenciador / DAW</text>
  </g>

  <!-- Camada 3: Teclado Sintetizador / Controlador -->
  <g id="layer-teclado-sintetizador">
    <rect x="40" y="196" width="296" height="92" rx="6" fill="#111114" stroke="#323238" stroke-width="1.4"/>
    <text x="188" y="217" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Teclado Sintetizador</text>
    <g fill="#D4D4D8" stroke="#09090B" stroke-width="1">
      <rect x="64" y="230" width="18" height="44" rx="2"/><rect x="82" y="230" width="18" height="44" rx="2"/>
      <rect x="100" y="230" width="18" height="44" rx="2"/><rect x="118" y="230" width="18" height="44" rx="2"/>
      <rect x="136" y="230" width="18" height="44" rx="2"/><rect x="154" y="230" width="18" height="44" rx="2"/>
      <rect x="172" y="230" width="18" height="44" rx="2"/><rect x="190" y="230" width="18" height="44" rx="2"/>
      <rect x="208" y="230" width="18" height="44" rx="2"/><rect x="226" y="230" width="18" height="44" rx="2"/>
      <rect x="244" y="230" width="18" height="44" rx="2"/><rect x="262" y="230" width="18" height="44" rx="2"/>
      <rect x="280" y="230" width="18" height="44" rx="2"/><rect x="298" y="230" width="18" height="44" rx="2"/>
    </g>
    <g fill="#09090B">
      <rect x="76" y="230" width="10" height="26"/><rect x="94" y="230" width="10" height="26"/>
      <rect x="130" y="230" width="10" height="26"/><rect x="148" y="230" width="10" height="26"/>
      <rect x="166" y="230" width="10" height="26"/><rect x="202" y="230" width="10" height="26"/>
      <rect x="220" y="230" width="10" height="26"/><rect x="256" y="230" width="10" height="26"/>
      <rect x="274" y="230" width="10" height="26"/><rect x="292" y="230" width="10" height="26"/>
    </g>
    <rect x="74" y="186" width="34" height="14" rx="3" fill="#09090B" stroke="#FF5500"/><text x="91" y="196" text-anchor="middle" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">IN</text>
    <rect x="128" y="186" width="38" height="14" rx="3" fill="#09090B" stroke="#38BDF8"/><text x="147" y="196" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">OUT</text>
    <rect x="250" y="186" width="46" height="14" rx="3" fill="#09090B" stroke="#A1A1AA"/><text x="273" y="196" text-anchor="middle" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">THRU</text>
  </g>

  <!-- Camada 4: Módulo Sintetizador -->
  <g id="layer-modulo-sintetizador">
    <rect x="406" y="196" width="178" height="92" rx="6" fill="#111114" stroke="#323238" stroke-width="1.4"/>
    <text x="495" y="217" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Módulo Sintetizador</text>
    <rect x="424" y="232" width="104" height="28" rx="3" fill="#09090B" stroke="#27272A"/>
    <text x="434" y="250" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="9.5">CH 02: PIANO</text>
    <circle cx="554" cy="246" r="11" fill="#09090B" stroke="#52525B" stroke-width="1.4"/>
    <line x1="554" y1="246" x2="560" y2="238" stroke="#FF5500" stroke-width="1.8"/>
    <rect x="424" y="186" width="34" height="14" rx="3" fill="#09090B" stroke="#A1A1AA"/><text x="441" y="196" text-anchor="middle" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">IN</text>
    <rect x="476" y="186" width="38" height="14" rx="3" fill="#09090B" stroke="#323238"/><text x="495" y="196" text-anchor="middle" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="8.5">OUT</text>
    <rect x="526" y="186" width="46" height="14" rx="3" fill="#09090B" stroke="#A1A1AA"/><text x="549" y="196" text-anchor="middle" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">THRU</text>
  </g>

  <!-- Camada 5: Módulo de Efeitos -->
  <g id="layer-modulo-efeitos">
    <rect x="652" y="196" width="186" height="92" rx="6" fill="#111114" stroke="#323238" stroke-width="1.4"/>
    <text x="745" y="217" text-anchor="middle" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Módulo de Efeitos</text>
    <rect x="670" y="232" width="76" height="38" rx="3" fill="#09090B" stroke="#222226"/>
    <rect x="678" y="240" width="58" height="4" fill="#FF5500"/><rect x="678" y="249" width="42" height="4" fill="#38BDF8"/><rect x="678" y="258" width="50" height="4" fill="#71717A"/>
    <circle cx="776" cy="251" r="10" fill="#09090B" stroke="#52525B" stroke-width="1.4"/>
    <circle cx="808" cy="251" r="10" fill="#09090B" stroke="#52525B" stroke-width="1.4"/>
    <rect x="668" y="186" width="34" height="14" rx="3" fill="#09090B" stroke="#A1A1AA"/><text x="685" y="196" text-anchor="middle" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">IN</text>
    <rect x="720" y="186" width="38" height="14" rx="3" fill="#09090B" stroke="#323238"/><text x="739" y="196" text-anchor="middle" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="8.5">OUT</text>
    <rect x="772" y="186" width="46" height="14" rx="3" fill="#09090B" stroke="#A1A1AA"/><text x="795" y="196" text-anchor="middle" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">THRU</text>
  </g>

  <!-- Camada 6: Cabos e Fluxo de Mensagens MIDI -->
  <g id="layer-cabos-rede-midi">
    <polyline points="174,96 91,96 91,180" fill="none" stroke="#FF5500" stroke-width="1.8" marker-end="url(#midiArrowOrange)"/>
    <polyline points="147,186 147,108 168,108" fill="none" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#midiArrowBlue)"/>
    <polyline points="273,186 273,148 441,148 441,180" fill="none" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#midiArrowMuted)"/>
    <polyline points="549,186 549,148 685,148 685,180" fill="none" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#midiArrowMuted)"/>
    <polyline points="795,186 795,148 892,148" fill="none" stroke="#A1A1AA" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#midiArrowMuted)"/>
  </g>

  <!-- Camada 7: Detalhe Conector DIN-5 -->
  <g id="layer-conector-din5">
    <rect x="652" y="24" width="236" height="90" rx="6" fill="#111114" stroke="#222226"/>
    <text x="668" y="44" fill="#F4F4F5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Conector DIN 5 Pinos</text>
    <circle cx="698" cy="80" r="20" fill="#09090B" stroke="#52525B" stroke-width="1.8"/>
    <circle cx="684" cy="80" r="2.2" fill="#71717A"/><circle cx="689" cy="71" r="2.2" fill="#FF5500"/>
    <circle cx="698" cy="67" r="2.2" fill="#38BDF8"/><circle cx="707" cy="71" r="2.2" fill="#FF5500"/>
    <circle cx="712" cy="80" r="2.2" fill="#71717A"/>
    <text x="734" y="70" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="9">31.25 kbps</text>
    <text x="734" y="85" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="9">16 canais / porta</text>
    <text x="734" y="100" fill="#71717A" font-family="'Inter', sans-serif" font-size="9">Apenas eventos</text>
  </g>

  <!-- Camada 8: Legenda -->
  <g id="layer-anotacoes">
    <line x1="20" y1="308" x2="900" y2="308" stroke="#222226" stroke-width="1"/>
    <circle cx="32" cy="321" r="3.5" fill="#FF5500"/>
    <text x="42" y="324" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="9.5">OUT → IN (Envio de eventos)</text>
    <circle cx="236" cy="321" r="3.5" fill="#38BDF8"/>
    <text x="246" y="324" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="9.5">Retorno Controlador → DAW</text>
    <circle cx="448" cy="321" r="3.5" fill="#A1A1AA"/>
    <text x="458" y="324" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="9.5">THRU → IN (Encadeamento em série)</text>
  </g>
</svg>
